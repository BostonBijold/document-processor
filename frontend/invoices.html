<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Invoices</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <span class="brand">Invoices</span>
    <nav>
      <a href="index.html">Upload</a>
      <a href="invoices.html" class="active">Invoices</a>
    </nav>
  </header>

  <main>
    <h1>Invoices</h1>

    <div class="filters">
      <input id="vendor-filter" type="text" placeholder="Filter by vendor…" />
      <select id="status-filter">
        <option value="">All statuses</option>
        <option value="unpaid">Unpaid</option>
        <option value="paid">Paid</option>
        <option value="overdue">Overdue</option>
      </select>
      <button id="apply-filters" type="button">Apply</button>
    </div>

    <div id="status-area"></div>
    <div class="card">
      <table id="invoice-table">
        <thead>
          <tr>
            <th>Vendor</th>
            <th>Invoice #</th>
            <th>Issue date</th>
            <th>Total</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="invoice-rows">
          <tr><td colspan="5" class="muted">Loading…</td></tr>
        </tbody>
      </table>
      <div class="pagination">
        <button id="prev-page" class="secondary" type="button">← Prev</button>
        <span id="page-info" class="muted"></span>
        <button id="next-page" class="secondary" type="button">Next →</button>
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="list.js"></script>
</body>
</html>
