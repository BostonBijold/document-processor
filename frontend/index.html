<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upload Invoice</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <span class="brand">Invoices</span>
    <nav>
      <a href="index.html" class="active">Upload</a>
      <a href="invoices.html">Invoices</a>
    </nav>
  </header>

  <main>
    <h1>Upload an invoice</h1>

    <div class="card">
      <form id="upload-form">
        <input id="file-input" type="file" accept="application/pdf,image/jpeg,image/png,.pdf,.jpg,.jpeg,.png" />
        <button id="submit-btn" type="submit">Upload</button>
      </form>
      <p class="muted" id="hint">Accepts PDF, JPG, or PNG.</p>
    </div>

    <div id="status-area"></div>
    <div id="result-area"></div>
  </main>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="upload.js"></script>
</body>
</html>
