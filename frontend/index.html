<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Invoices</title>
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
  <header>
    <span class="brand">Invoices</span>
    <span class="spacer"></span>
    <input id="file-input" type="file" accept="application/pdf,image/jpeg,image/png,.pdf,.jpg,.jpeg,.png" hidden />
    <button id="upload-btn" type="button">+ Upload invoice</button>
  </header>

  <div id="upload-status"></div>

  <main class="app-layout">
    <section class="list-panel">
      <div class="filters">
        <input id="vendor-filter" type="text" placeholder="Filter by vendor…" />
        <select id="status-filter">
          <option value="">All statuses</option>
          <option value="unpaid">Unpaid</option>
          <option value="paid">Paid</option>
          <option value="overdue">Overdue</option>
        </select>
        <button id="apply-filters" type="button">Apply</button>
      </div>

      <div id="list-status"></div>
      <div id="accordion" class="accordion"></div>

      <div class="pagination">
        <button id="prev-page" class="secondary" type="button">← Prev</button>
        <span id="page-info" class="muted"></span>
        <button id="next-page" class="secondary" type="button">Next →</button>
      </div>
    </section>

    <aside class="preview-panel">
      <div class="preview-header">Document preview</div>
      <div id="preview-body" class="preview-body">
        <p class="muted">Select an invoice to preview its document.</p>
      </div>
    </aside>
  </main>

  <script src="config.js?v=3"></script>
  <script src="api.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
